<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R. Mutt</title>
<link rel="icon" href="assets/heart-tag.svg">
<link rel="stylesheet" href="assets/fonts.css">
<!--
  rmutt.dog · a fountain, for dogs
  produced by joey frank
  type: Zodiak (display) + General Sans (text), via Fontshare
-->
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #fff;
    color: #111;
    font-family: "General Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 16px 20px;
    font-size: 14px;
    font-weight: 600;
    flex: 0 0 auto;
  }
  nav a { color: #111; text-decoration: none; }
  nav a:hover, nav a:focus-visible { color: #999; }
  nav .mark {
    font-family: "Zodiak", "Times New Roman", serif;
    font-weight: 700;
    font-size: 22px;
    line-height: 1;
  }

  .hero {
    flex: 1 1 auto;
    min-height: 0;
    margin: 0 20px;
    overflow: hidden;
    background: #f2f2f2;
  }
  .hero a { display: block; height: 100%; }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: contain;  /* native ratio, no crop; sits in the gray panel */
    display: block;
  }

  .heromatter {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 12px 20px 14px;
    font-size: 13px;
  }
  .heromatter .t b {
    font-family: "Zodiak", "Times New Roman", serif;
    font-weight: 700;
    font-size: 15px;
  }
  .heromatter .t span { color: #999; }
  .heromatter .right { color: #999; display: flex; gap: 18px; align-items: baseline; }
  .heromatter a { color: #111; text-decoration: none; font-weight: 700; }
  .heromatter a:hover, .heromatter a:focus-visible { color: #999; }
  #soundbtn {
    font: inherit;
    color: #999;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  #soundbtn:hover, #soundbtn:focus-visible { color: #111; }

  #ticker {
    flex: 0 0 auto;
    background: #fff;
    border-top: 1px solid #e5e5e5;
    color: #999;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 2.6;
    white-space: nowrap;
    overflow: hidden;
  }
  #ticker .reel { display: inline-block; padding-left: 100vw; animation: reel 60s linear infinite; }
  @keyframes reel { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {
    #ticker .reel { animation: none; padding-left: 20px; }
  }
</style>
</head>
<body>

<nav>
  <a class="mark" href="index.html">R.&hairsp;Mutt</a>
  <a href="shop.html">Shop</a>
</nav>

<figure class="hero" style="margin-block:0">
  <a href="shop.html" aria-label="Fountain dog bed — enter the shop">
    <img src="assets/hero.jpg"
         alt="A whippet inspecting a plush white dog bed shaped like Duchamp's urinal, signed R. Mutt 1917, on a herringbone wood floor in a sunlit room">
  </a>
</figure>

<div class="heromatter">
  <p class="t" style="margin:0"><b>Fountain</b> <span>The readymade dog bed &middot; Produced by Joey Frank</span></p>
  <p class="right" style="margin:0">
    <button id="soundbtn" type="button" aria-pressed="false">Sound off</button>
    <a href="shop.html">Shop &rarr;</a>
  </p>
</div>

<div id="ticker" aria-hidden="true"><span class="reel" id="reel"></span></div>

<audio id="growl" src="assets/growl.mp3" loop preload="auto"></audio>

<script>
/* ticker */
var LINES = [
  "Fountain, the readymade dog bed",
  "US $191.70 plus shipping",
  "Currently out of stock",
  "Interested parties may leave an address in the shop",
  "As seen at the Society of Independent Artists, 1917 (rejected)",
  "An ordinary article of everyday life",
  "He chose it."
];
var tape = LINES.join("&ensp;&ensp;&#8226;&ensp;&ensp;") + "&ensp;&ensp;&#8226;&ensp;&ensp;";
document.getElementById("reel").innerHTML = tape + tape; /* doubled so the loop is seamless */

/* growl */
var audio = document.getElementById("growl");
var btn = document.getElementById("soundbtn");
var wantSound = false;

btn.addEventListener("click", function () {
  wantSound = !wantSound;
  if (wantSound) { audio.play().catch(function(){ wantSound = false; setBtn(); }); }
  else { audio.pause(); }
  setBtn();
});
function setBtn() {
  btn.textContent = wantSound ? "Sound on" : "Sound off";
  btn.setAttribute("aria-pressed", String(wantSound));
}
audio.volume = 0.55;
</script>
</body>
</html>
